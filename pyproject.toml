[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openreflect-local-memorycore-engram"
version = "0.1.0"
description = "Local provenance substrate for source-backed AI memory routing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
eval = ["jsonschema>=4"]

[project.scripts]
memorycore = "memorycore.cli:main"

[tool.setuptools.packages.find]
include = ["memorycore*"]
